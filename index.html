<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- Thumbnail Preview Meta Tags -->
    <meta property="og:title" content="Click here to visit our site" />
    <meta property="og:description" content="You are being safely redirected to our page." />
    <meta property="og:image" content="https://githubusercontent.com" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter/X Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://githubusercontent.com" />

    <!-- 1. Meta Refresh Delay set to 5 seconds -->
    <meta http-equiv="refresh" content="5; url=https://effectivecpmnetwork.com">
    <title>Redirecting...</title>
    
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; color: #333; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>Redirecting you to the destination...</h2>
    <div class="spinner"></div>
    <p>Please wait 5 seconds. If you are not redirected automatically, <a href="https://effectivecpmnetwork.com">click here</a>.</p>

    <!-- 2. JavaScript Delay set to 5 seconds (5000 milliseconds) -->
    <script>
        setTimeout(function() {
            window.location.replace("https://effectivecpmnetwork.com");
        }, 5000);
    </script>
</body>
</html>
